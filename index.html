<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Finansys — Fechamentos Maio 2026</title>
<style>
  :root{
    --navy:#0a1f44; --navy2:#13366b; --gold:#c8a24a; --bg:#f4f6fb;
    --card:#ffffff; --txt:#1a2233; --muted:#6b7689;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--txt);min-height:100vh;padding:32px 16px}
  .wrap{max-width:860px;margin:0 auto}
  header{text-align:center;margin-bottom:36px}
  .logo{display:inline-block;background:var(--navy);color:#fff;font-weight:700;
        letter-spacing:2px;padding:10px 22px;border-radius:8px;font-size:18px}
  .logo span{color:var(--gold)}
  h1{font-size:26px;margin-top:18px;color:var(--navy)}
  .sub{color:var(--muted);margin-top:6px;font-size:15px}
  .grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:30px}
  @media(min-width:680px){.grid{grid-template-columns:1fr 1fr}}
  .card{background:var(--card);border-radius:14px;padding:22px 20px;
        box-shadow:0 4px 18px rgba(10,31,68,.08);border:1px solid #e6eaf2;
        display:flex;flex-direction:column;gap:14px;transition:.2s}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(10,31,68,.14)}
  .card h2{font-size:18px;color:var(--navy)}
  .card .tag{font-size:12px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .btns{display:flex;gap:10px;margin-top:auto}
  .btn{flex:1;text-align:center;text-decoration:none;font-weight:600;font-size:14px;
       padding:11px 0;border-radius:9px;transition:.15s}
  .btn-view{background:var(--navy);color:#fff}
  .btn-view:hover{background:var(--navy2)}
  .btn-pdf{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .btn-pdf:hover{background:#eef2fa}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">FINAN<span>SYS</span></div>
      <h1>Fechamentos — Maio 2026</h1>
      <p class="sub">Relatórios mensais consolidados</p>
    </header>

    <div class="grid">
      <div class="card">
        <span class="tag">Associação</span>
        <h2>ACAB — Maio 2026</h2>
        <div class="btns">
          <a class="btn btn-view" href="acab-maio-2026-17734f08.html">Abrir painel</a>
          <a class="btn btn-pdf" href="acab-maio-2026-17734f08.pdf">PDF</a>
        </div>
      </div>

      <div class="card">
        <span class="tag">Posto</span>
        <h2>Posto Carga Pesada — Maio 2026</h2>
        <div class="btns">
          <a class="btn btn-view" href="posto-maio-2026-17734f08.html">Abrir painel</a>
          <a class="btn btn-pdf" href="posto-maio-2026-17734f08.pdf">PDF</a>
        </div>
      </div>

      <div class="card">
        <span class="tag">Terminal</span>
        <h2>Terminal Carga Pesada — Maio 2026</h2>
        <div class="btns">
          <a class="btn btn-view" href="terminal-maio-2026-17734f08.html">Abrir painel</a>
          <a class="btn btn-pdf" href="terminal-maio-2026-17734f08.pdf">PDF</a>
        </div>
      </div>
    </div>

    <footer>© 2026 Finansys · Documento confidencial</footer>
  </div>
</body>
</html>
